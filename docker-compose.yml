services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: myintern
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: myintern
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myintern"]
      interval: 2s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    # 6380 on host to avoid clashing with other local Redis/Valkey (e.g. proj-atlas on 6379)
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: myintern
      MINIO_ROOT_PASSWORD: dev-minio-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # one-shot: create the default bucket, then exit.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 myintern dev-minio-secret &&
      mc mb -p local/uploads &&
      echo 'bucket uploads ready'
      "

  # myIntern control plane (UI + API). Runs as a container so its logs stream to
  # Dozzle and it stays up independent of the host shell. Opt-in profile so
  # `make up` (infra only) doesn't rebuild it every time.
  myintern:
    build: .
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://myintern:dev@postgres:5432/myintern
      PORT: "7788"
    ports:
      - "7788:7788"

  # Dozzle: live log viewer for all containers at http://localhost:8888
  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"

volumes:
  pgdata:
  miniodata:
