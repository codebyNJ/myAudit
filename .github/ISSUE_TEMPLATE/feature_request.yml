name: Feature Request
description: Suggest an idea for myAudit
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please check [existing issues](https://github.com/codebyNJ/myAudit/issues) and [Discussions](https://github.com/codebyNJ/myAudit/discussions) first.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who benefits?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, related projects, workflow details
