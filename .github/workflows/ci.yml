name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Test web
        working-directory: web
        run: npm test

      - name: Typecheck & build web
        working-directory: web
        run: npm run build

      - name: Embed UI
        run: |
          rm -rf internal/api/web/dist
          cp -r web/dist internal/api/web/dist

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test $(go list ./... | grep -v '/runs/') -count=1

      - name: govulncheck
        run: go tool govulncheck $(go list ./... | grep -v '/runs/')

      - name: Build server
        run: go build ./cmd/serve

      # The server ships inside the desktop app on all three platforms, so a
      # Unix-only syscall must not sneak in (it did: agent.go used Setpgid and
      # syscall.Kill, which broke the Windows release build).
      - name: Cross-compile check
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=linux   GOARCH=amd64 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
