name: CodeQL

# Static security analysis for both halves of the product. The server handles
# caller-supplied filesystem paths and shells out to agent CLIs, which is
# exactly the scope SECURITY.md claims (path traversal, sandbox escape), so a
# dataflow-aware scanner earns its place here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published query finds old code without waiting for a PR.
    - cron: '41 5 * * 2'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # The Go build needs the embedded UI to exist, or //go:embed fails.
      - name: Stub embedded UI
        if: matrix.language == 'go'
        run: |
          mkdir -p internal/api/web/dist
          [ -f internal/api/web/dist/index.html ] || echo '<div id="root"></div>' > internal/api/web/dist/index.html

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
