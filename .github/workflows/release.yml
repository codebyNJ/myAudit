name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0) — no tag is created'
        required: true

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building version ${V}"

  build:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            triple: aarch64-apple-darwin
          # Built on the Apple Silicon runner: GitHub retired the macos-13
          # (Intel) images, so that label now queues forever. Rust cross-compiles
          # to x86_64 with the target installed, and Go cross-compiles natively.
          - label: macOS (Intel)
            os: macos-14
            triple: x86_64-apple-darwin
          - label: Linux (x86_64)
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - label: Windows (x86_64)
            os: windows-latest
            triple: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.triple }}

      # Tauri's Linux bundler needs webkit2gtk and friends.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      # Keep the installer version in step with the git tag, so what ships is
      # traceable to a commit rather than the checked-in scaffold version.
      - name: Stamp version ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          V="${{ needs.version.outputs.version }}"
          node -e "
            const fs=require('fs'), p='desktop/src-tauri/tauri.conf.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.version='$V';
            fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');
          "
          node -e "
            const fs=require('fs'), p='desktop/src-tauri/Cargo.toml';
            let c=fs.readFileSync(p,'utf8');
            c=c.replace(/^version = \".*\"/m, 'version = \"$V\"');
            fs.writeFileSync(p,c);
          "
          node -e "
            const fs=require('fs'), p='desktop/package.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.version='$V';
            fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');
          "

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # Builds the web UI, embeds it in the Go server, and drops that server in
      # desktop/src-tauri/binaries as the Tauri sidecar for this triple.
      - name: Build Go sidecar
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.triple }}
        run: ./scripts/build-sidecar.sh

      - name: Run Go tests
        run: go test $(go list ./... | grep -v '/runs/') -count=1

      # CI=true makes Tauri's bundle_dmg.sh skip the Finder/AppleScript window
      # styling, which needs a GUI session and fails on a headless runner.
      - name: Build desktop bundle
        working-directory: desktop
        env:
          CI: true
        run: npx tauri build --target ${{ matrix.triple }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          B="desktop/src-tauri/target/${{ matrix.triple }}/release/bundle"
          find "$B" -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' \) -exec cp {} dist/ \; || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: myAudit-${{ needs.version.outputs.version }}-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: myAudit v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
