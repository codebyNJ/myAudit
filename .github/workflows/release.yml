name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0) — no tag is created'
        required: true
      publish:
        description: 'Publish to GitHub Releases (pre-release when not triggered by a tag)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          else
            V="${GITHUB_REF_NAME#v}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building version ${V}"

  build-macos:
    name: Desktop · macOS (Apple Silicon)
    needs: version
    runs-on: macos-14
    # The `secrets` context cannot be read from a step-level `if:`; surfacing the
    # certificate here lets the signing steps branch on `env` instead.
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: aarch64-apple-darwin

      - name: Stamp version ${{ needs.version.outputs.version }}
        run: |
          V="${{ needs.version.outputs.version }}"
          node -e "
            const fs=require('fs'), p='desktop/src-tauri/tauri.conf.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.version='$V';
            fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');
          "
          node -e "
            const fs=require('fs'), p='desktop/src-tauri/Cargo.toml';
            let c=fs.readFileSync(p,'utf8');
            c=c.replace(/^version = \".*\"/m, 'version = \"$V\"');
            fs.writeFileSync(p,c);
          "
          node -e "
            const fs=require('fs'), p='desktop/package.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.version='$V';
            fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');
          "

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Go sidecar
        env:
          TARGET_TRIPLE: aarch64-apple-darwin
        run: ./scripts/build-sidecar.sh

      - name: Build app bundle
        working-directory: desktop
        run: npx tauri build --target aarch64-apple-darwin --bundles app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import Apple signing certificate
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ github.run_id }}

      - name: Resolve signing identity
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            IDENTITY="$(security find-identity -v -p codesigning | grep 'Developer ID Application' | head -1 | sed -E 's/^[[:space:]]*[0-9]+[[:space:]]+"([^"]+)".*/\1/')"
            if [ -z "$IDENTITY" ]; then
              echo "::error::Developer ID Application certificate not found in keychain"
              exit 1
            fi
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            echo "Using signing identity: $IDENTITY"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::APPLE_CERTIFICATE_BASE64 not configured — ad-hoc signing only (users will see Gatekeeper warnings)"
          fi

      - name: Sign and package DMG
        env:
          VERSION: ${{ needs.version.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/codesign-macos-app.sh scripts/repack-dmg.sh scripts/ensure-pillow.sh scripts/notarize-dmg.sh
          APP="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/myAudit.app"
          ./scripts/codesign-macos-app.sh "$APP"
          ./scripts/repack-dmg.sh "$VERSION" "$APP" dist

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Desktop · Windows (x86_64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: x86_64-pc-windows-msvc

      - name: Stamp version ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          V="${{ needs.version.outputs.version }}"
          node -e "
            const fs=require('fs'), p='desktop/src-tauri/tauri.conf.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.version='$V';
            fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');
          "
          node -e "
            const fs=require('fs'), p='desktop/src-tauri/Cargo.toml';
            let c=fs.readFileSync(p,'utf8');
            c=c.replace(/^version = \".*\"/m, 'version = \"$V\"');
            fs.writeFileSync(p,c);
          "
          node -e "
            const fs=require('fs'), p='desktop/package.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.version='$V';
            fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');
          "

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Go sidecar
        shell: bash
        env:
          TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: ./scripts/build-sidecar.sh

      - name: Build Windows installer
        working-directory: desktop
        env:
          CI: true
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Package installers
        shell: bash
        run: |
          chmod +x scripts/package-release.sh
          B="desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          ./scripts/package-release.sh "${{ needs.version.outputs.version }}" "$B" x86_64-pc-windows-msvc dist

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build-macos, build-windows]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: myAudit v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.is_tag != 'true' }}
          generate_release_notes: false
          body_path: .github/RELEASE_NOTES.md
          files: dist/*
