name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0) — no tag is created'
        required: true
      publish:
        description: 'Publish to GitHub Releases (pre-release when not triggered by a tag)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          else
            V="${GITHUB_REF_NAME#v}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building version ${V}"

  build-desktop:
    name: Desktop · ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            triple: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-14
            triple: x86_64-apple-darwin
          - label: Linux (x86_64)
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - label: Windows (x86_64)
            os: windows-latest
            triple: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.triple }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf zip

      - name: Install zip (macOS)
        if: runner.os == 'macOS'
        run: command -v zip >/dev/null || brew install zip

      - name: Stamp version ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          V="${{ needs.version.outputs.version }}"
          node -e "
            const fs=require('fs'), p='desktop/src-tauri/tauri.conf.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.version='$V';
            fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');
          "
          node -e "
            const fs=require('fs'), p='desktop/src-tauri/Cargo.toml';
            let c=fs.readFileSync(p,'utf8');
            c=c.replace(/^version = \".*\"/m, 'version = \"$V\"');
            fs.writeFileSync(p,c);
          "
          node -e "
            const fs=require('fs'), p='desktop/package.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.version='$V';
            fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');
          "

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Go sidecar
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.triple }}
        run: ./scripts/build-sidecar.sh

      - name: Run Go tests
        run: go test $(go list ./... | grep -v '/runs/') -count=1

      - name: Build desktop bundle
        working-directory: desktop
        env:
          CI: true
        run: npx tauri build --target ${{ matrix.triple }}

      - name: Package installers
        shell: bash
        run: |
          chmod +x scripts/package-release.sh
          B="desktop/src-tauri/target/${{ matrix.triple }}/release/bundle"
          ./scripts/package-release.sh "${{ needs.version.outputs.version }}" "$B" "${{ matrix.triple }}" dist

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  build-cli:
    name: CLI · ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            triple: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-14
            triple: x86_64-apple-darwin
          - label: Linux (x86_64)
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - label: Windows (x86_64)
            os: windows-latest
            triple: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Package CLI archive
        shell: bash
        run: |
          chmod +x scripts/package-cli.sh
          ./scripts/package-cli.sh "${{ needs.version.outputs.version }}" "${{ matrix.triple }}" dist

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build-desktop, build-cli]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: myAudit v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.is_tag != 'true' }}
          generate_release_notes: true
          files: dist/*
